<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image</title>
<style>
  html { background: #54575c; }
  body { margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: flex-start; }
  img {
    display: block;
    max-width: 100%;
    height: auto;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    background: repeating-conic-gradient(#fff 0 25%, #e9e9ec 0 50%) 0 0 / 16px 16px;
  }
</style>
</head>
<body>
<img id="mk-image" alt="Image being reviewed">
<script>
  const img = document.getElementById('mk-image');
  img.src = 'file?doc=' + encodeURIComponent(new URLSearchParams(location.search).get('doc') || '');
  const loaded = new Promise((resolve) => { img.onload = img.onerror = resolve; });
  // Screenshots taken on high-density displays are shown at their logical size when they fit.
  loaded.then(() => {
    const dpr = window.devicePixelRatio || 1;
    if (dpr > 1 && img.naturalWidth / dpr >= 600) img.style.width = Math.round(img.naturalWidth / dpr) + 'px';
  });
  window.__mkViewer = {
    kind: 'image',
    anchorAt() { return img; },
    describe(region, point) {
      const r = img.getBoundingClientRect();
      return {
        short: 'Image',
        label: `The image (${img.naturalWidth}×${img.naturalHeight}px)`,
        pos: {
          x: Math.round(Math.min(100, Math.max(0, ((point.x - r.left) / r.width) * 100))),
          y: Math.round(Math.min(100, Math.max(0, ((point.y - r.top) / r.height) * 100))),
        },
      };
    },
    idle() { return loaded; },
  };
</script>
</body>
</html>
